name = "prince-portfolio-contact"
main = "worker.js"
compatibility_date = "2024-01-01"

# ─── Routes ──────────────────────────────────────────────────────────────────
# After deploying, get your worker URL from:
# https://dash.cloudflare.com -> Workers & Pages -> your worker -> Routes
# It will look like: https://prince-portfolio-contact.<your-subdomain>.workers.dev

# ─── Environment Secrets ─────────────────────────────────────────────────────
# NEVER put your actual API key here. Use the Wrangler CLI:
#
#   wrangler secret put RESEND_API_KEY
#   (then paste your key when prompted)
#
# Or set it via the Cloudflare dashboard:
#   Workers & Pages → your worker → Settings → Variables → Add secret

[vars]
# Non-secret variables can go here if needed in the future
