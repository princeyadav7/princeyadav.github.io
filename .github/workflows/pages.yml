name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Sets required permissions to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for SEO scripts)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SEO batch fix
        run: node scratch/seo_fix_all.js
        # Note: scratch/ is gitignored so this runs on the checked-out source.
        # The fixes are applied before the site is uploaded to Pages.

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site to GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the entire repo root (excluding .git etc.)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
